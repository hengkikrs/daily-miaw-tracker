<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Miaw Tracker - Analitik Kebiasaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260910-ui10" />
  <link rel="stylesheet" href="theme.css?v=20260910-ui10" />
  <link rel="icon" href="cat-logo.svg" />
</head>
<body class="auth-required">
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <section id="authScreen" class="auth-screen" aria-live="polite"></section>

  <aside id="sidebar" class="sidebar app-shell" aria-label="Navigasi utama">
    <div class="brand">
      <img class="brand-mark" src="cat-logo.svg" alt="" aria-hidden="true" />
      <div class="brand-copy">
        <h1>Miaw Tracker</h1>
        <p>Jejak harian, mingguan, dan bulanan</p>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" type="button" data-view="dashboard">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="15" width="7" height="6"/></svg>
        </span>
        <span>Dasbor</span>
      </button>

      <div class="nav-group" data-group="aktivitas">
        <button class="nav-group-toggle" type="button" data-group-toggle="aktivitas" aria-expanded="false">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L9.5 22 18 10.5h-6.5L13 2z"/></svg>
          </span>
          <span class="nav-group-name">Aktivitas</span>
          <span class="nav-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="nav-group-items">
          <div class="nav-group-items-inner">
            <button class="nav-item sub" type="button" data-view="task"><span>Task</span></button>
            <button class="nav-item sub" type="button" data-view="jadwal"><span>Jadwal</span></button>
            <button class="nav-item sub" type="button" data-view="kalender"><span>Kalender</span></button>
          </div>
        </div>
      </div>

      <div class="nav-group" data-group="diri">
        <button class="nav-group-toggle" type="button" data-group-toggle="diri" aria-expanded="false">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 20v-6"/><path d="M12 14c-4 0-6-2.5-6-6 3 0 6 1 6 6z"/><path d="M12 14c4 0 6-2.5 6-6-3 0-6 1-6 6z"/></svg>
          </span>
          <span class="nav-group-name">Pengembangan Diri</span>
          <span class="nav-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="nav-group-items">
          <div class="nav-group-items-inner">
            <button class="nav-item sub" type="button" data-view="habits"><span>Kebiasaan</span></button>
            <button class="nav-item sub" type="button" data-view="goals"><span>Goals</span></button>
            <button class="nav-item sub" type="button" data-view="progress"><span>Progress</span></button>
          </div>
        </div>
      </div>

      <div class="nav-group" data-group="organisasi">
        <button class="nav-group-toggle" type="button" data-group-toggle="organisasi" aria-expanded="false">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
          </span>
          <span class="nav-group-name">Organisasi</span>
          <span class="nav-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="nav-group-items">
          <div class="nav-group-items-inner">
            <button class="nav-item sub" type="button" data-view="project"><span>Project</span></button>
            <button class="nav-item sub" type="button" data-view="catatan"><span>Catatan</span></button>
            <button class="nav-item sub" type="button" data-view="dokumen"><span>Dokumen</span></button>
          </div>
        </div>
      </div>

      <div class="nav-group" data-group="keuangan">
        <button class="nav-group-toggle" type="button" data-group-toggle="keuangan" aria-expanded="false">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1.1-3 2.5 1.3 2.5 3 2.5 3 1.1 3 2.5-1.3 2.5-3 2.5-3-1.1-3-2.5"/></svg>
          </span>
          <span class="nav-group-name">Keuangan</span>
          <span class="nav-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="nav-group-items">
          <div class="nav-group-items-inner">
            <button class="nav-item sub" type="button" data-view="transaksi"><span>Transaksi</span></button>
            <button class="nav-item sub" type="button" data-view="budget"><span>Budget</span></button>
            <button class="nav-item sub" type="button" data-view="tabungan"><span>Tabungan</span></button>
            <button class="nav-item sub" type="button" data-view="laporan-keuangan"><span>Laporan</span></button>
          </div>
        </div>
      </div>

      <button class="nav-item" type="button" data-view="reports">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14v4M12 9v9M17 5v13"/></svg>
        </span>
        <span>Laporan</span>
      </button>

      <button class="nav-item" type="button" data-view="miawai">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
        </span>
        <span>MiawAI</span>
      </button>

      <button class="nav-item" type="button" data-view="account">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Akun</span>
      </button>

      <div class="nav-block">
        <label class="nav-label" for="yearSelect">Tahun pelacakan</label>
        <select id="yearSelect" class="year-select" aria-label="Tahun pelacakan"></select>
      </div>

      <div class="nav-block">
        <div class="nav-label">Tab bulanan</div>
        <div id="monthList" class="month-list" role="list"></div>
      </div>
    </nav>
  </aside>

  <main class="main app-shell">
    <header class="topbar">
      <button id="menuBtn" class="icon-button mobile-only" type="button" aria-label="Buka navigasi">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="title-group">
        <h2 id="pageTitle">Dasbor</h2>
        <p id="pageSubtitle">Ringkasan kebiasaan tahunan</p>
      </div>

      <label id="taskSearchWrap" class="task-search" hidden>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="taskSearchInput" type="search" placeholder="Cari task…" autocomplete="off" />
      </label>

      <div id="authPanel" class="auth-panel" aria-live="polite"></div>

      <button id="themeToggle" class="icon-button" type="button" aria-label="Ganti tema warna" title="Ganti tema warna">
        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </header>

    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="runtime-config.js?v=20260525"></script>
  <script src="app.js?v=20260910-ui10"></script>
</body>
</html>
